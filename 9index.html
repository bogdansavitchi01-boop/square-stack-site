<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">

    <title>Electricity - Square Stack Store</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        .product-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 25px;
        }

        .product-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
            background: #1f2937;
            padding: 30px;
            border-radius: 18px;
        }

        .product-image-box {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #374151;
            border-radius: 15px;
            min-height: 300px;
        }

        #product-image {
            max-width: 90%;
            max-height: 300px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .product-info h1 {
            font-size: 32px;
            margin-top: 0;
        }

        #product-category,
        #product-version {
            color: #9ca3af;
        }

        #product-description {
            line-height: 1.8;
            margin: 25px 0;
        }

        #product-features {
            line-height: 2;
            padding-left: 22px;
        }

        #product-price {
            color: #4ade80;
            font-size: 28px;
            margin-top: 25px;
        }

        button {
            padding: 13px 20px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            margin: 8px 5px 8px 0;
        }

        #add-to-cart {
            background: #22c55e;
            color: #052e16;
        }

        #back-to-store {
            background: #374151;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        #product-message {
            color: #4ade80;
            min-height: 24px;
        }

        .product-footer {
            text-align: center;
            margin-top: 35px;
            color: #9ca3af;
        }

        .product-icon {
            font-size: 120px;
            text-align: center;
            padding: 60px;
        }

        @media (max-width: 700px) {
            .product-container {
                margin: 15px auto;
                padding: 12px;
            }

            .product-card {
                grid-template-columns: 1fr;
                padding: 18px;
                gap: 20px;
            }

            .product-info h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <main class="product-container">

        <div class="product-card">

            <div class="product-image-box">
                <div id="product-icon" class="product-icon">⚡</div>
            </div>

            <section class="product-info">

                <p> SQUARE STACK STORE / MODURI </p>

                <h1 id="product-name">Electricity</h1>

                <p id="product-category"></p>

                <p id="product-version"></p>

                <p id="product-description">
                    Se încarcă descrierea produsului...
                </p>

                <h3>Caracteristici principale</h3>

                <ul id="product-features"></ul>

                <h2 id="product-price">40 MDL</h2>

                <button id="add-to-cart">
                    Adaugă în coș
                </button>

                <button id="back-to-store">
                    Înapoi la magazin
                </button>

                <p id="product-message"></p>

            </section>

        </div>

        <footer class="product-footer">
            <p>© 2026 Square Stack. Toate drepturile rezervate.</p>
            <p>Square Stack Store - Produse digitale pentru jocul tău.</p>
        </footer>

    </main>

    <script src="product-page.js"></script>

</body>

</html>
